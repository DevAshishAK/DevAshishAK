<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="7+ years building scalable microservices. Java, Spring Boot, Microservices. Fintech and HR-Tech products. Growing toward Lead Engineer." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 20px;
      fill: #2c9cdb;
      text-anchor: middle;
      opacity: 0;
      animation: lineIn 0.7s ease-out forwards;
    }
    .l1 { font-weight: 700; animation-delay: 0.3s; }
    .l2 { animation-delay: 1.5s; }
    .l3 { animation-delay: 2.7s; }
    .l4 { animation-delay: 3.9s; }
    @keyframes lineIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <text class="l1" x="320" y="30">7+ years building scalable microservices</text>
  <text class="l2" x="320" y="65">Java | Spring Boot | Microservices</text>
  <text class="l3" x="320" y="100">Fintech &amp; HR-Tech products</text>
  <text class="l4" x="320" y="135">Growing toward Lead Engineer</text>
</svg>
